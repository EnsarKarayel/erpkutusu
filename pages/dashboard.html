<body style="padding:40px; max-width:900px; margin:auto;">

<h1>Dashboard Generator</h1>
<p>Satış ve maliyet verilerinizi girerek grafik oluşturun.</p>

<br>

<label>Satış (₺)</label><br>
<input type="number" id="sales" style="width:100%; padding:10px;"><br><br>

<label>Maliyet (₺)</label><br>
<input type="number" id="cost" style="width:100%; padding:10px;"><br><br>

<button onclick="createChart()">Grafik Oluştur</button>

<h2 id="result"></h2>

<canvas id="myChart" style="margin-top:30px;"></canvas>

<script>
let chart;

function createChart(){

    let sales = Number(document.getElementById("sales").value);
    let cost = Number(document.getElementById("cost").value);

    if(!sales || !cost){
        alert("Lütfen tüm alanları doldurun");
        return;
    }

    let profit = sales - cost;

    document.getElementById("result").innerText =
        "Kar: " + profit + " ₺";

    let ctx = document.getElementById("myChart");

    if(chart){
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Satış', 'Maliyet', 'Kar'],
            datasets: [{
                label: 'Finansal Durum',
                data: [sales, cost, profit],
            }]
        },
        options: {
            responsive: true,
        }
    });
}
</script>
